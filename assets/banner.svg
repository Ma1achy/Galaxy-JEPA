  <!-- the masking grid: what the model is actually asked to do -->
  <g transform="translate(1012 74)" opacity=".92">
    <rect x="0" y="0" width="132" height="132" rx="6" fill="none" stroke="#3d4a6e" stroke-width="1.5"/>
    <g stroke="#2c3757" stroke-width="1">
      <path d="M33 0V132M66 0V132M99 0V132M0 33H132M0 66H132M0 99H132"/>
    </g>
    <g fill="#7fd1ff" opacity=".30">
      <rect x="34" y="1"  width="31" height="31"/><rect x="67" y="34" width="31" height="31"/>
      <rect x="1"  y="67" width="31" height="31"/><rect x="100" y="100" width="31" height="31"/>
    </g>
    <text x="66" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"
          fill="#8fa3c8" text-anchor="middle">predict the hidden representation</text>
  </g>

  <text x="300" y="112" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#f2f5fb" letter-spacing="-0.5">Galaxy&#8209;JEPA</text>
  <text x="302" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="19" fill="#9db2d6">Learn galaxy morphology without labels. Then use the labels only to read it back.</text>
  <text x="302" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5"
        fill="#6f86ad">self-supervised JEPA &#183; frozen encoder &#183; linear concept probes</text>
</svg>
