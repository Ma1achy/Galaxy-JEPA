<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Galaxy-JEPA — learning galaxy morphology without labels">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1020"/>
      <stop offset="55%"  stop-color="#141c33"/>
      <stop offset="100%" stop-color="#1d2542"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe9c4" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#ffc978" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7fd1ff" stop-opacity="0.00"/>
      <stop offset="45%"  stop-color="#7fd1ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9b6ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)"/>

