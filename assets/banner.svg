    <circle cx="1064" cy="168" r="1.0" opacity=".31"/><circle cx="1142" cy="54" r="1.3" opacity=".40"/>
    <circle cx="1176" cy="214" r="1.1" opacity=".34"/><circle cx="96"  cy="128" r="1.2" opacity=".28"/>
