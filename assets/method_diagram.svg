<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img"
     aria-label="Two-stage method: label-free JEPA pretraining, then probing a frozen encoder">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a737d"/>
    </marker>
    <style>
      .t  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1b1f23 }
      .m  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; fill:#57606a }
      .h  { font-size:15px; font-weight:700 }
      .b  { font-size:12.5px }
      .s  { font-size:11px; fill:#6a737d }
      .box{ fill:#ffffff; stroke:#d5dbe2; stroke-width:1.4; rx:8 }
      .ln { stroke:#6a737d; stroke-width:1.5; fill:none; marker-end:url(#a) }
    </style>
  </defs>

  <rect width="1120" height="470" fill="#fbfcfd"/>

  <!-- stage panels -->
  <rect x="18" y="54" width="600" height="376" rx="12" fill="#f4f8fb" stroke="#dce6ee" stroke-width="1.4"/>
  <rect x="648" y="54" width="454" height="376" rx="12" fill="#f6f4f9" stroke="#e4dcec" stroke-width="1.4"/>

  <text x="38" y="36" class="t h">Stage 1 — representation</text>
  <text x="262" y="36" class="t b" fill="#3f8f6b">no labels anywhere</text>
  <text x="668" y="36" class="t h">Stage 2 — measurement</text>
  <text x="892" y="36" class="t b" fill="#8250df">labels enter, read-only</text>

  <!-- stamp + mask -->
  <rect x="44" y="126" width="96" height="96" class="box"/>
  <g stroke="#e6ebf0" stroke-width="1">
    <path d="M68 126V222M92 126V222M116 126V222M44 150H140M44 174H140M44 198H140"/>
  </g>
  <g fill="#2f6f9f" opacity=".26">
    <rect x="68.7" y="126.7" width="23" height="23"/><rect x="92.7" y="174.7" width="23" height="23"/>
    <rect x="44.7" y="198.7" width="23" height="23"/>
  </g>
  <circle cx="92" cy="174" r="17" fill="#c9622f" opacity=".30"/>
  <text x="92" y="243" class="t s" text-anchor="middle">native FITS stamp</text>
  <text x="92" y="258" class="t s" text-anchor="middle">256 px, never resampled</text>
  <text x="92" y="112" class="t b" text-anchor="middle">mask blocks</text>

  <!-- encoders -->
  <path d="M146 158 H196" class="ln"/>
  <path d="M146 196 H196" class="ln"/>

  <rect x="200" y="118" width="150" height="52" class="box"/>
  <text x="275" y="140" class="t b" text-anchor="middle" font-weight="600">context encoder</text>
  <text x="275" y="157" class="m" font-size="10.5" text-anchor="middle">ViT-S/16 · trained</text>

  <rect x="200" y="182" width="150" height="52" class="box" stroke-dasharray="5 3"/>
  <text x="275" y="204" class="t b" text-anchor="middle" font-weight="600">target encoder</text>
  <text x="275" y="221" class="m" font-size="10.5" text-anchor="middle">EMA copy · no grad</text>

  <path d="M275 118 V100 H366 V176" stroke="#6a737d" stroke-width="1.2" fill="none"
        stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="320" y="94" class="t s" text-anchor="middle">EMA copy of the weights</text>

  <!-- predictor + loss -->
  <path d="M356 144 H404" class="ln"/>
  <rect x="408" y="118" width="120" height="52" class="box"/>
  <text x="468" y="140" class="t b" text-anchor="middle" font-weight="600">predictor</text>
  <text x="468" y="157" class="m" font-size="10.5" text-anchor="middle">narrow · 6 layers</text>

  <path d="M468 174 V206" class="ln"/>
  <path d="M356 208 H404" class="ln"/>
  <rect x="408" y="206" width="180" height="56" rx="8" fill="#eef6f1" stroke="#bcd9c8" stroke-width="1.4"/>
  <text x="498" y="229" class="t b" text-anchor="middle" font-weight="600">latent MSE</text>
  <text x="498" y="247" class="t s" text-anchor="middle">predict the representation, not pixels</text>

  <text x="44" y="306" class="t b" font-weight="600">What this forces</text>
  <text x="44" y="326" class="t s">To predict a hidden region's representation, the encoder has to</text>
  <text x="44" y="342" class="t s">build one: shape, structure, bulge, arms. It is never told what</text>
  <text x="44" y="358" class="t s">any of those are called.</text>
  <text x="44" y="386" class="m" font-size="11" fill="#3f8f6b">826,968 galaxies · 0 labels</text>

  <!-- the freeze boundary -->
  <path d="M633 62 V422" stroke="#8250df" stroke-width="2" stroke-dasharray="7 5"/>
  <g transform="translate(633 242)">
    <rect x="-31" y="-16" width="62" height="32" rx="16" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
    <text x="0" y="5" class="t" font-size="11.5" font-weight="700" fill="#8250df" text-anchor="middle">FREEZE</text>
  </g>
  <text x="633" y="440" class="t s" text-anchor="middle" fill="#8250df">the boundary runs through disk — a checkpoint, not a flag</text>

  <!-- stage 2 -->
  <rect x="676" y="118" width="150" height="52" class="box" stroke="#8250df"/>
  <text x="751" y="140" class="t b" text-anchor="middle" font-weight="600">frozen encoder</text>
  <text x="751" y="157" class="m" font-size="10.5" text-anchor="middle">eval() · requires_grad=False</text>

  <path d="M832 144 H878" class="ln"/>
  <rect x="882" y="118" width="196" height="52" class="box"/>
  <text x="980" y="140" class="t b" text-anchor="middle" font-weight="600">embeddings</text>
  <text x="980" y="157" class="m" font-size="10.5" text-anchor="middle">384-d, fixed for all time</text>

  <path d="M980 174 V206" class="ln"/>
  <rect x="882" y="206" width="196" height="56" rx="8" fill="#f5f0fb" stroke="#d8c9ee" stroke-width="1.4"/>
  <text x="980" y="229" class="t b" text-anchor="middle" font-weight="600">linear concept probe</text>
  <text x="980" y="247" class="t s" text-anchor="middle">unit weight vector = the direction</text>

  <rect x="676" y="206" width="176" height="56" rx="8" fill="#fdf3ec" stroke="#eccdb4" stroke-width="1.4"/>
  <text x="764" y="229" class="t b" text-anchor="middle" font-weight="600">Galaxy Zoo votes</text>
  <text x="764" y="247" class="t s" text-anchor="middle">a read-out key, never a target</text>
  <path d="M856 234 H878" class="ln"/>

  <text x="676" y="306" class="t b" font-weight="600">What this buys</text>
  <text x="676" y="326" class="t s">A wrong label can blur a read-out direction — a local,</text>
  <text x="676" y="342" class="t s">measurable error. It cannot reshape the encoder's geometry,</text>
  <text x="676" y="358" class="t s">because the encoder is already finished.</text>
  <text x="676" y="386" class="m" font-size="11" fill="#8250df">label noise becomes measurement error, not representation error</text>
</svg>
