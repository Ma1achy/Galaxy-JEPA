not_implemented:
- 8×8 ablation (D11)
- untrained-MLP bar (D25; R3 unreachable)
- Tracy–Widom edge
- vote-floor sweep [1, 5, 11, 21, 37]
- inclination conditioning vs b/a (only S1/V2 proxies)
- 'confound 2: recoverability vs imaging depth'
- Scheme 2 as a 10-family ladder (only U3's 4 axes)
- free probe replication (1B)
- confidence-as-target (D9)
- GalaxyMNIST
- supervised label-efficiency arm
