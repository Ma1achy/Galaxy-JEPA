# Galaxy-JEPA CI — staged scientific validation & regression gate.
#
# Staged by cost, fail-fast:
#   1. lint + type-check (seconds)
#   2. fast gate: unit + invariant + regression + property + differential + scientific +
#      calibration + isolated scientific mutation catalogue (runs on every push & PR)
#   3. integration + CPU miniature E2E pipeline (runs on PR)
#   4. nightly / manual full validation manifest + mutation audit (GPU deferred)
#
# MERGE-BLOCKING RULE: the invariant, regression, differential, and mutation checks in
# `fast` are merge-blocking. Any regression of frozen-encoder boundaries, masking firewalls,
# independent target-block prediction, statistical calibration, or provenance fails CI.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep install cheap and the gate fast: CPU torch wheels, no CUDA.
  UV_TORCH_BACKEND: cpu

jobs:
  lint:
    name: lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  fast:
    name: unit + invariant (the gate)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `eval` as well as `dev`: the gate covers probing read-outs (sklearn), statistical
      # tests/MI (scipy), calibration, and the isolated 21-mutant scientific audit.
      - run: uv sync --extra dev --extra eval
      - run: uv run pytest -m "not integration and not e2e and not gpu and not slow and not external_data" --durations=10
      - run: uv run python tools/mutation_audit.py

  integration:
    name: integration + CPU mini E2E
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra data --extra eval
      - run: uv run pytest -m "integration or (e2e and not gpu)"

  e2e:
    name: full validation manifest (manual / nightly; GPU deferred)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra data --extra eval
      - run: uv run python tools/research_validate.py --out /tmp/validation_manifest.json
