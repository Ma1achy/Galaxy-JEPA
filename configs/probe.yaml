# Probing config — the fields `ProbingConfig` takes. One of these fully determines a probing
# run and is hashed into the artefact stamp.
#
# The five statistical decisions below are GROUNDED (docs/galaxy-jepa-spec.pdf §Statistics),
# not placeholders. What is still open is marked OPEN.

smoke: false                # true -> stamps `smoke` into escape_hatches_used; NOT a result
escape_hatches: []          # a declared deviation from a grounded default, e.g.
                            #   [reduced_permutations] to run below the ≥10,000-shuffle floor
scheme_name: full_tree      # D14: full_tree (37) first, then reduced
seed: 0
ratios: [0.70, 0.15, 0.15]
extreme_low: 0.2            # the uncertainty firewall: axis fits on v<=0.2 or v>=0.8 only
extreme_high: 0.8
device: null

# --- conditional population (D14) — a COMPARISON, never a mask -------------------------
compare_populations: true   # runs the ladder on the full AND the consensus-conditional set
consensus_gate: 0.5         # OPEN (spec register 2): which upstream vote, which threshold
# --- the reliable-label floor (D8 — SUPERSEDED, and FROZEN at unfiltered) ---------------
# D8 said reuse v1's mean+2σ agreement filter. Withdrawn, deliberately, not left unset: v1
# needed it because v1 TRAINED ON THE LABELS, and v2's encoder never sees one. The floor now
# sits at the minimum where a vote fraction is DEFINED — 1, not 0, because GZ2 stores an
# unreached question's fraction as a literal 0.0 and admitting those would be 118,962
# fabricated negatives on t09 alone. Full reasoning rides in the freeze record below and in
# DECISIONS.md "D8 superseded".
vote_count_min: 1
vote_count_freeze:
  value: 1
  # Pre-registered robustness check, recorded BEFORE any results exist. The ladder is re-run at
  # each point and the agreement reported as a stability claim. NOT a selection step: the
  # headline is `value` above, fixed in advance, and must not be revised on the basis of which
  # threshold produces better results. `ProbingConfig` refuses a headline outside this set.
  sweep: [1, 5, 11, 21, 37]
  derived_from: >-
    GZ2 probe corpus, 230,358 galaxies. Reach at the frozen floor (question total, all answers
    summed): t09 bulge shape 111,396 | t10 arms winding 134,688 | t11 arms number 134,684.
    Per-bucket positives at threshold 0.5 — t09 boxy 7,894 | t10 tight 60,809 / medium 49,519 /
    loose 22,541 | t11 1-arm 8,265 / 4-arms 1,075 / >4-arms 2,801.
  frozen_at: '2026-09-12'
  frozen_by: malachy
  rationale: >-
    D8 IS SUPERSEDED, NOT SATISFIED. This is a reversal with a reason, not a value being filled
    in. v1 needed the mean+2σ filter because v1 TRAINED ON THE LABELS — vote noise flowed
    through the loss and bent the encoder weights, so noisy galaxies had to be excluded up
    front. v2 breaks that coupling: the encoder never sees a label. The filter's original
    purpose does not transfer. Label noise in a PROBE TARGET is conservative: it attenuates
    measured association toward chance and cannot manufacture a direction. A feature clearing
    the gate despite unfiltered labels is therefore a STRONGER result, not a weaker one. The
    existence null is computed on the same labels, so the comparison stays like-for-like.
    Filtering costs power precisely on the features the paper is about (t09 boxy positives:
    7,894 unfiltered, 302 at >=5, 100 at >=21, 33 at >=37 — the "829 at >=37" figure in the
    brief was that question's REACH at >=37, not its positives; the corrected series runs the
    same way and further). VALUE is 1, not 0: a question nobody answered has an undefined 0/0
    fraction, and GZ2 encodes it as a literal 0.0 rather than a blank, so 51.6% of the corpus
    carries t09 boxy = 0.0 meaning "never asked". Admitting those would not be an unfiltered
    run, it would be 118,962 fabricated negatives. STATED HONESTLY: most of the extra reach is
    shallow — 89.8% of t09 boxy's positives at this floor rest on <=2 votes, median question
    total 1. Those are unreplicated human judgements, not fabrications, so they attenuate rather
    than invent; the registered sweep is what turns that from an assertion into a measurement.

# --- the canonical probe ---------------------------------------------------------------
c: 1.0                      # L2 inverse-strength (D7)
n_boot: 2000

# --- existence + effect floor (decisions 1 and 2) — two gates, both must pass -----------
alpha: 0.05
n_null_draws: 50            # the shuffled / random-embedding control draws. Under
                            # `existence_method: empirical` this also sets the test's RESOLUTION
                            # (min attainable p = 1/(n+1)), and Scheme 1's BY family of 37 needs
                            # >= 3109 or nothing can pass — `nulls.assert_null_resolution`
                            # refuses rather than returning an empty catalogue that reads like a
                            # scientific null. Under `untrained_z` (below) the p-value is
                            # parametric and has no resolution floor, so these 50 draws are what
                            # they always should have been: reported controls and the MLP
                            # selectivity ceiling, not the existence test's denominator.

# --- how existence is computed (D23) ----------------------------------------------------
# `existence_null_samples` is a POINT MASS: the untrained singleton floors every draw, so the
# add-one p-value returns only 1/(n+1) or 1.0 and Benjamini-Yekutieli has nothing to order. A
# 37-feature catalogue without working multiplicity control is the exact failure BY was chosen to
# prevent. `untrained_z` compares the real AUC to the untrained bar measured across K seeds, with
# the bar's seed spread AND the real AUC's bootstrap SE in the denominator, on a Student t with
# df = K-1. See D23 for the argument and for what is given up (a normality assumption, tested and
# reported per feature rather than asserted).
existence_method: untrained_z
n_untrained_seeds: 30       # K. `nulls.assert_untrained_bank_resolution` refuses below K_MIN=20,
                            # because K is what every z-denominator's sd is estimated from.
untrained_bank_path: artifacts/out/p1_untrained_bank.json

# DEFERRED (Brief P): the uncertainty geometry is the high-beta headline and carries an open
# decision of its own — a vote-count floor or weighting LOCAL to the uncertainty test and the
# consensus-extreme split. 50/50 on 60 votes is genuinely ambiguous; 2/2 on 4 may be merely
# undersampled. Gated off rather than deleted.
uncertainty_geometry: false
# FROZEN (Brief O0) — spec register item 4 is closed. The value is a scientific judgement, and
# its one honest window was the medium local run; that window has now been used. Both lines move
# together or `_freezes_agree_with_the_live_values` refuses the config at load, which is the point.
effect_floor: 0.7267
effect_floor_freeze:
  value: 0.7267
  derived_from: >-
    Brief N1/N2 on runs/m/encoder.pt (M's 4-epoch checkpoint, step 101,308, lambda=0 under D21,
    D17 schedule, stamped v2:61330a0012234374). Six Scheme-1 features spanning the difficulty
    range, declared in j4_spread_controls.SPREAD before any number existed and re-used unedited:
    40,000 train / 34,829 test, vote_count_min=1, C=1.0. Real AUCs 0.5226 (t10 arms medium),
    0.5847 (t09 bulge boxy), 0.5889 (t10 arms tight), 0.6538 (t10 arms loose), 0.7995 (t02
    edge-on), 0.8845 (t01 featured-or-disk). Evidence in artifacts/n_findings.md and
    artifacts/out/{n1_spread_controls.json,n2_floor_evidence.txt}.
  frozen_at: '2026-09-20'
  frozen_by: 'malachy'
  rationale: >-
    CHOSEN BY STRUCTURE, NOT BY WHICH FEATURES IT ADMITS. Every value in (0.6538, 0.7995] gives an
    IDENTICAL partition of the six probed features -- a band 0.146 wide, bounded below by arms-loose
    and above by edge-on. 0.7267 is that band's centre and the point furthest from any feature's
    flip (0.0729 either way). For contrast the old placeholder 0.6500 sat 0.0038 from a flip and the
    pooled null ceiling 0.7908 sat 0.0087 from one: both are coincidences rather than thresholds.
    It admits featured-ness (0.8845) and edge-on (0.7995); it excludes arms-loose (0.6538),
    arms-tight (0.5889), bulge-boxy (0.5847) and arms-medium (0.5226). All six clear their own
    binding null, so all six would still pass EXISTENCE -- the floor separates clean from marginal
    among the real, which is 3B's job for it.
    THE MARGIN FORM WAS MEASURED AND REJECTED, on four grounds. The decisive one: a feature's null
    ceiling is EXACTLY the supremum of `existence_null_samples` (verified against the production
    function over 200 random cases), so a margin floor is a TIGHTENING OF EXISTENCE rather than a
    second gate -- the one property 3B disclaims when it grounds the floor as acceptable "because it
    no longer does the existence work". The others: it reorders the catalogue by a random network's
    luck (bulge-boxy has a lower real AUC than arms-tight, 0.5847 vs 0.5889, but a higher margin,
    +0.0489 vs +0.0415; at margin 0.10 it excludes featured-ness, the strongest feature, while
    admitting edge-on); its verdicts move with the untrained seed (flips at margin 0.05 and 0.09)
    whereas an absolute floor never reads the null at all; and `effect_floor` has five consumers, of
    which ladder.py:121, :161 and :248 have no defined "the feature's own binding null" to take a
    margin over.
    THE EXISTENCE BAR IS ARCHITECTURE-DETERMINED, stated here as the bar's definition rather than
    left implicit: `controls.untrained_encoder_matrix` never sees the trained checkpoint, so the bar
    is a property of (architecture, seed, galaxies) alone -- M's untrained nulls came back identical
    to J's to four decimals on all six features. The untrained singleton dominates every resampled
    draw (0.5160 vs 0.5143 at the narrowest), so `existence_null_samples` has zero variance and the
    existence test reduces exactly to `real_auc > untrained_encoder_auc`.
    TWO LIMITATIONS TRAVEL WITH THIS VALUE AND ARE TO BE REPORTED, NOT HIDDEN. (1) J5's fourth
    objection is unresolved: n = 6 cannot locate a threshold for a catalogue of 37, and the widest
    gap is a fact about which six features were chosen. The band argument softens that -- any point
    inside (0.6538, 0.7995] costs nothing here -- but it does not remove it. (2) t10 arms-medium's
    verdict is SEED-DEPENDENT: its margin over the binding null is +0.0065 at untrained seed 0 and
    +0.0006 at seed 1. No floor fixes that. It is honest evidence that some features sit below what
    this apparatus resolves.

# --- multiplicity (decision 3) ---------------------------------------------------------
multiplicity: benjamini_yekutieli   # correlated tests; FDR is the right target
n_primary_tests: null       # null -> the active scheme's family size (per-scheme, not global)

# --- selectivity / nuisance triggers (not among the five; still flagged) ----------------
selectivity_floor: 0.10
nuisance_competitive_margin: 0.0

# --- entanglement (decision 5) ---------------------------------------------------------
mp_method: upper_edge       # MP edge for the ACTUAL matrix shape; tracy_widom raises
entangled_pair_quantile: 0.90

# --- MLP capacity ladder (the one site still FLAGGED) ----------------------------------
mlp_widths: [16, 32, 64, 128, 256, 512]
mlp_depth: 1
mlp_weight_decay: 0.0001
mlp_epochs: 200
mlp_lr: 0.001
ceiling_method: null_quantile
ceiling_null_quantile: 0.95 # FLAGGED: the selectivity-ceiling predicate is unmapped

# --- uncertainty geometry (decision 4) -------------------------------------------------
permutation_method: two_sided
n_perm: 10000               # hard floor; lower it only with the declared escape hatch
