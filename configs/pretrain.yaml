# Pretraining config — the values `HarnessConfig` / `JepaConfig` actually take.
# The pilot ran at these settings (bar the corpus size) and cleared its gates: frozen-probe
# AUC 0.905, no collapse. Load with `RunConfig`-style validation: extra keys are a load-time
# error, never a silent default.
#
#   uv run python -c "from galaxy_jepa.harness import HarnessConfig, run_harness; ..."

paths:                        # WHERE it reads and writes. Not hashed into `config_hash`
  pretrain_dir: data/pretrain #   (RunConfig.NON_DETERMINING), so relocating a corpus onto
  probe_dir: data/probe           #   another disk is not a different experiment. Which galaxies
  out_dir: runs/full          #   a run saw is RunStamp.data_snapshot's job, not a path's.

runtime:                      # WHAT it ran on. This one IS hashed — MPS / CPU / CUDA differ
  device: null                #   numerically. null -> pick_device(); the RESOLVED value is
                              #   what enters the hash, or two backends would share one.

seed: 0
q: 4.0                      # asinh stretch softening
monitor_frac: 0.02          # pretrain slice held out for the collapse monitor
autocast: null              # null | bf16 | fp16
ratios: [0.70, 0.15, 0.15]  # probe train / val / test

# The frozen normalisation statistic (D16). NOT fitted at run time — `_build_pipeline` loads
# this record and has no fitting path at all; a missing, `Q`-mismatched or hand-edited record
# is a loud failure. Re-derive only with `artifacts/e5_fit_normalisation.py`, deliberately.
# `content_hash` covers every field above it that determines the numbers, so an edit here
# without a re-fit is refused at load rather than believed — including a tidier rounding.
normalisation:
  derived_from: 'data/pretrain (826968 stamps; 827 excluded from the fit only, fitted on 826141). Stability over 200 disjoint halves: median 0.314%, worst 0.861%, 0.0% breaching the 1% tolerance'
  frozen_at: '2026-09-11'
  frozen_by: 'malachy'
  rationale: "fit once over valid pixels only, on the whole pretraining corpus less a 0.1% heaviest-stamp trim, and pinned — closing the per-run refit whose seeded subsample moved when the corpus grew 10k -> 827k. No draw was made, so seed is inert. The trim is not gate-passing: the census sigma is inflated by a small minority (top 1% of stamps carry 13.4/17.9/10.5% of sum-of-squares by channel), and normalising by an outlier-inflated sigma compresses the typical galaxy's post-normalisation range. The trimmed sigma reflects the typical stamp; bright stamps correctly extend beyond +-1. Constants are a preprocessing transform, not a population parameter needing an unbiased estimate. Trim applies to the FIT ONLY — every stamp stays in the corpus and in training"
  mean: [0.009454908658610726, 0.01630844769710272, 0.02318442785313156]
  std: [0.07904613852166308, 0.10820447247619723, 0.14095327215176595]
  corpus: 'pretrain'
  n_sample: 826141
  seed: 0
  stretch_q: 4.0
  valid_pixels_only: true
  detector: 'like-4-neighbour bit-identity, all channels, region >= 256px'
  trim_rank: 'total valid-pixel sum-of-squares across all channels, post-asinh'
  trim_threshold: 36779.561450152854
  trim_excluded: 827
  trim_ids_sha256: 'bf2a8d0bf1338304b08318e256f8bccae0efd11495ae90bbc4829bfec14127c1'
  content_hash: '75100066b3e059b0a996af12d93d34870080f950da37c579599f3be73771bcf0'
  code_sha: 'f9d668fc3863a14abc6fc80c6577f74a8d0776a5-dirty'

model:                      # clean ViT-S/16 (D2) — no conv stem, so masking semantics stay
  patch_size: 16            # unambiguous. Stamp size comes from the baked cache, not from here.
  embed_dim: 384
  depth: 12
  heads: 6
  mlp_ratio: 4.0

objective:                  # docs/masking.md; the JEPA recipe
  beta: 0.5                 # headline. 0.0 == standard I-JEPA (the control); sweep {0, 0.5, 1.0}
  petro_k: 2.5              # per-galaxy box half-width = k * R_petro, clamped
  global_box_frac: 0.4      # the fallback box when petroRad is missing/<=0
  steps: 50000              # the interpretable full run (the pilot was 6k)
  batch_size: 32            # measured: MPS is compute-bound here (runs/calib2.log)
  lr: 0.001
  weight_decay: 0.04
  warmup_steps: 100
  ema_start: 0.996
  ema_end: 1.0
  pred_dim: 192
  pred_depth: 6
  pred_heads: 6
  monitor_every: 100
  checkpoint_every: 1500    # steps. At the measured 1.297 steps/s that is ~19 min of work at
                            #   risk; 0 would gamble the whole job and is stamped as a forfeit.

# The pre-registered collapse kill criterion (G5). Recorded BEFORE the run, because a criterion
# chosen after seeing the curve is not a criterion. Hashed into `config_hash` and enforced by
# `CollapseMonitor`; leaving it unset stamps `collapse_floor_open`.
collapse_floor:
  min_effective_rank: 5.0   # half the pilot's ~10.3, the only erank in this project tied to a
                            #   working probe (AUC 0.905). Deliberately NOT the smoke's 4.1.
  grace_fraction: 0.10      # of `steps`, from the EMA ramp's own timescale — not from a curve
  hard_floor: 2.0           # essentially one direction; unambiguous
  hard_floor_after_step: 100 # the LR warmup
  consecutive_readings: 3   # one noisy monitor batch must not end a ten-hour job
  derived_from: >-
    Pilot run (runs/pilot.log, 6,000 steps on a 10,000-stamp pretrain split): effective rank
    22.6 -> 10.2 by step 100 and held 10.2-10.6 to the end; frozen-probe AUC 0.900-0.905. Brief F
    smoke (300 steps, 827k corpus): 22.6 -> 4.1 by step 175, then flat, std rising 0.28 -> 5.17.
  frozen_at: '2026-09-12'
  frozen_by: malachy
  rationale: >-
    The threshold is anchored on the one place a collapse signal is tied to a SCIENTIFIC OUTCOME:
    the pilot held erank around 10.3 and its frozen probe reached AUC 0.905. Half that is the
    floor, so a run in the pilot's regime is never killed. It is deliberately not set near the
    4.1 the Brief F smoke plateaued at, because reading the threshold off the curve it is meant to
    judge would make it no criterion at all. The grace period comes from the schedule's own shape
    rather than any observed trace: the EMA momentum ramps from ema_start to ema_end across the
    whole run, so early steps have a fast-moving target and an unsettled representation is
    expected. The hard floor is the unambiguous case. WHAT IS NOT KNOWN: the pilot is one trace,
    on 10,000 stamps of a different corpus, with a smaller batch of monitor galaxies; the smoke
    ran 300 steps. Neither says what 827k should look like. This floor is therefore conservative
    about declaring failure and explicitly PROVISIONAL — a tripwire against burning days on a
    dead run, not a claim about where healthy training sits. Re-derive it from the first real
    trace, deliberately, and record that as a new freeze.

probe:                      # the single-feature headline read-out (NOT the battery below)
  label_col: t01_smooth_or_features_a02_features_or_disk_fraction   # RAW, never debiased
  extreme_low: 0.2
  extreme_high: 0.8
  c: 1.0

probing:                    # the full battery — off by default; see ProbingStageConfig
  enabled: false            # the design runs it after a LABEL-BLIND checkpoint choice (spec 1C)
  scheme: full_tree         # D14 order: full tree first, then `reduced`
  max_galaxies: null
